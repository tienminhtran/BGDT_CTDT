<svg
  width="320"
  height="240"
  viewBox="0 0 320 240"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <filter
      id="soft-shadow"
      x="-20%"
      y="-20%"
      width="140%"
      height="160%"
    >
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="6"
        flood-color="#1E293B"
        flood-opacity="0.08"
      />
    </filter>

    <linearGradient id="folder-grad" x1="50" y1="90" x2="250" y2="190">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="folder-back-grad" x1="50" y1="70" x2="250" y2="170">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="160" cy="220" rx="95" ry="8" fill="#E5E7EB" />

  <!-- Background -->
  <circle cx="75" cy="130" r="45" fill="#F1F5F9"/>
  <circle cx="245" cy="120" r="55" fill="#EEF2FF"/>

  <!-- Folder back -->
  <path
    d="M55 82
       C55 77 59 73 64 73
       H110
       L126 88
       H247
       C252 88 256 92 256 97
       V174
       C256 179 252 183 247 183
       H64
       C59 183 55 179 55 174
       Z"
    fill="url(#folder-back-grad)"
  />

  <!-- Folder -->
  <path
    d="M48 105
       C48 100 52 96 57 96
       H113
       L130 111
       H255
       C260 111 264 115 264 120
       V182
       C264 190 258 196 250 196
       H62
       C54 196 48 190 48 182
       Z"
    fill="url(#folder-grad)"
    filter="url(#soft-shadow)"
  />

  <!-- Face -->
  <g
    stroke="#374151"
    stroke-width="7"
    stroke-linecap="round"
    fill="none"
  >
    <!-- Left eye -->
    <line x1="112" y1="130" x2="128" y2="146"/>
    <line x1="128" y1="130" x2="112" y2="146"/>

    <!-- Right eye -->
    <line x1="192" y1="130" x2="208" y2="146"/>
    <line x1="208" y1="130" x2="192" y2="146"/>

    <!-- Sad mouth -->
    <path
      d="M105 177
         C130 150,
           190 150,
           215 177"
    />
  </g>

  <!-- Decorations -->
  <g stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round">
    <line x1="22" y1="42" x2="22" y2="54"/>
    <line x1="16" y1="48" x2="28" y2="48"/>

    <line x1="288" y1="36" x2="288" y2="48"/>
    <line x1="282" y1="42" x2="294" y2="42"/>

    <line x1="34" y1="184" x2="34" y2="196"/>
    <line x1="28" y1="190" x2="40" y2="190"/>

    <circle cx="42" cy="28" r="2" fill="#94A3B8" stroke="none"/>
    <circle cx="270" cy="64" r="2.5" fill="#94A3B8" stroke="none"/>
  </g>
</svg>