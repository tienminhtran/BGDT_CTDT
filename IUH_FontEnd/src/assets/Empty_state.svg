<svg
  width="500"
  height="420"
  viewBox="0 0 400 320"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- ===== Decorative bars left ===== -->
  <g fill="#E2E8F0">
    <rect x="35" y="95"  width="70"  height="10" rx="5"/>
    <rect x="20" y="120" width="95"  height="8"  rx="4" fill="#EDF1F5"/>
    <rect x="45" y="145" width="100" height="8"  rx="4" fill="#EDF1F5"/>
    <rect x="30" y="170" width="85"  height="8"  rx="4" fill="#EDF1F5"/>
    <rect x="55" y="195" width="65"  height="8"  rx="4" fill="#EDF1F5"/>
    <circle cx="24" cy="210" r="6"/>
  </g>

  <!-- ===== Decorative bars right ===== -->
  <g fill="#E2E8F0">
    <rect x="300" y="170" width="90"  height="10" rx="5"/>
    <rect x="275" y="195" width="115" height="8"  rx="4" fill="#EDF1F5"/>
    <rect x="305" y="220" width="80"  height="8"  rx="4" fill="#EDF1F5"/>
  </g>

  <!-- ===== Top decorations ===== -->
  <g stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round">
    <circle cx="100" cy="70" r="4" fill="#CBD5E1" stroke="none"/>
    <circle cx="130" cy="52" r="3" fill="#CBD5E1" stroke="none"/>
    <line x1="185" y1="58" x2="200" y2="58"/>
    <line x1="205" y1="58" x2="220" y2="58"/>
    <circle cx="270" cy="65" r="4" fill="#CBD5E1" stroke="none"/>
    <circle cx="288" cy="52" r="3" fill="#CBD5E1" stroke="none"/>
    <circle cx="75" cy="205" r="4" fill="#CBD5E1" stroke="none"/>
  </g>

  <!-- ===== Sparkle burst (top right of folder) ===== -->
  <g stroke="#CBD5E1" stroke-width="4" stroke-linecap="round">
    <line x1="258" y1="88"  x2="252" y2="105"/>
    <line x1="272" y1="92"  x2="265" y2="108"/>
    <line x1="284" y1="102" x2="270" y2="112"/>
  </g>

  <!-- ===== Folder back (peeking) ===== -->
  <path
    d="M120 118
       C120 113 124 109 129 109
       H175
       L188 122
       H255
       C260 122 264 126 264 131
       V150
       H120
       Z"
    fill="#EEF2F6"
    stroke="#D6DEE6"
    stroke-width="3"
  />

  <!-- ===== Folder front ===== -->
  <path
    d="M108 140
       C108 134 113 129 119 129
       H172
       L188 145
       H272
       C278 145 283 150 283 156
       V228
       C283 238 275 246 265 246
       H126
       C116 246 108 238 108 228
       Z"
    fill="#F8FAFC"
    stroke="#CBD5E1"
    stroke-width="4"
  />

  <!-- ===== Sad face ===== -->
  <g>
    <!-- eyebrows -->
    <path d="M158 178 C163 172, 172 172, 177 178" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M213 178 C218 172, 227 172, 232 178" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- eyes -->
    <circle cx="167" cy="192" r="6" fill="#64748B"/>
    <circle cx="222" cy="192" r="6" fill="#64748B"/>
    <!-- sad mouth -->
    <path d="M170 222 C185 210, 210 210, 225 222" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ===== Bottom wavy divider ===== -->
  <path
    d="M60 285
       H130
       C138 285 138 273 146 273
       C154 273 154 285 162 285
       H250
       C258 285 258 273 266 273
       C274 273 274 285 282 285
       H340"
    stroke="#CBD5E1"
    stroke-width="2.5"
    stroke-linecap="round"
    fill="none"
    stroke-dasharray="4 6"
  />

  <!-- ===== Text ===== -->
  <text
    x="200"
    y="315"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="18"
    fill="#94A3B8"
  >
    Không có dữ liệu
  </text>
</svg>