<svg
  width="320"
  height="240"
  viewBox="0 0 320 240"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Đổ bóng mềm cho các phần tử chính -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1E293B" flood-opacity="0.08" />
    </filter>

    <!-- Gradient cho mặt kính lúp -->
    <linearGradient id="glass-grad" x1="180" y1="100" x2="250" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#DBEAFE" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Gradient cho Folder -->
    <linearGradient id="folder-grad" x1="50" y1="90" x2="250" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="folder-back-grad" x1="50" y1="70" x2="250" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Bóng nền dưới chân -->
  <ellipse cx="160" cy="220" rx="100" ry="8" fill="#E2E8F0"/>

  <!-- Nền đệm trang trí mềm mại (Blobs) -->
  <circle cx="80" cy="130" r="50" fill="#F1F5F9"/>
  <circle cx="240" cy="120" r="60" fill="#EEF2FF"/>

  <!-- BACK FOLDER (Nắp thư mục phía sau) -->
  <path
    d="M55 80 C55 75.5 58.5 72 63 72 H110 L125 87 H247 C251.5 87 255 90.5 255 95 V175 C255 179.5 251.5 183 247 183 H63 C58.5 183 55 179.5 55 175 V80 Z"
    fill="url(#folder-back-grad)"
  />

  <!-- TỜ GIẤY BUỒN (Nằm giữa folder back và front) -->
  <g transform="translate(112, 32) rotate(8)" filter="url(#soft-shadow)">
    <!-- Thân giấy -->
    <rect x="0" y="0" width="85" height="105" rx="8" fill="#FFFFFF"/>
    <rect x="0" y="0" width="85" height="105" rx="8" stroke="#E2E8F0" stroke-width="2"/>
    
    <!-- Dòng kẻ giả trên giấy -->
    <line x1="12" y1="18" x2="35" y2="18" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Mắt -->
    <circle cx="28" cy="45" r="3.5" fill="#475569"/>
    <circle cx="57" cy="45" r="3.5" fill="#475569"/>

    <!-- Má hồng -->
    <circle cx="22" cy="52" r="4" fill="#FECDD3" opacity="0.8"/>
    <circle cx="63" cy="52" r="4" fill="#FECDD3" opacity="0.8"/>
    <path d="M34 68 Q42.5 58 51 68" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
  <path
    d="M48 105 C48 100.5 51.5 97 56 97 H112 L128 110 H254 C258.5 110 262 113.5 262 118 V180 C262 188.8 254.8 196 246 196 H64 C55.2 196 48 188.8 48 180 V105 Z"
    fill="url(#folder-grad)"
    filter="url(#soft-shadow)"
  />

  <g filter="url(#soft-shadow)">
    <line x1="228" y1="168" x2="272" y2="208" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
    <line x1="228" y1="168" x2="272" y2="208" stroke="#475569" stroke-width="8" stroke-linecap="round"/>

    <circle cx="195" cy="135" r="42" fill="url(#glass-grad)" stroke="#3B82F6" stroke-width="6"/>
    
    <path d="M172 112 A32 32 0 0 1 215 112" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.7" fill="none"/>
  </g>

  <!-- HỌA TIẾT TRANG TRÍ (Sparkles & Crosses) -->
  <g stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round">
    <!-- Ngôi sao nhỏ bên trái -->
    <path d="M 22 45 L 22 55 M 17 50 L 27 50" />
    <circle cx="40" cy="30" r="2" fill="#94A3B8" stroke="none" />

    <!-- Ngôi sao nhỏ bên phải -->
    <path d="M 282 40 L 282 50 M 277 45 L 287 45" />
    <circle cx="265" cy="65" r="2.5" fill="#3B82F6" stroke="none" />
    
    <!-- Chấm nhỏ dưới góc -->
    <circle cx="35" cy="180" r="2" fill="#94A3B8" stroke="none" />
  </g>
</svg>
